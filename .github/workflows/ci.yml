name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test data
        run: echo "LIVEOPS_DATA_ROOT=$RUNNER_TEMP/liveops-test-data" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Install pinned FFmpeg for real media tests
        run: python3 scripts/install.py --components ffmpeg --apply
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/check_frontend.py
