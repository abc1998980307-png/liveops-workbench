name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test data
        run: echo "LIVEOPS_DATA_ROOT=$RUNNER_TEMP/liveops-test-data" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Install pinned FFmpeg for real media tests
        run: python3 scripts/install.py --components ffmpeg --apply
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/check_frontend.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test data
        run: echo "LIVEOPS_DATA_ROOT=$env:RUNNER_TEMP\liveops-test-data" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: python -m unittest tests.test_windows_platform tests.test_keyword_service.KeywordJobsTests.test_windows_analysis_timeout_stops_owned_worker tests.test_keyword_service.KeywordJobsTests.test_windows_timeout_watchdog_stops_worker_without_state_polling tests.test_media_pipeline tests.test_hot_insights tests.test_team_overview tests.test_insights_http -v
      - run: python -m unittest discover -s tests -p 'test_flv_recovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_mcp*.py' -v
      - run: python scripts/check_frontend.py
